<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <!-- iPlace B2B hero illustration: a request form on a laptop, the request
       list on a phone and a "sent" confirmation card. Generic devices only. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef4fe"/>
    </linearGradient>
  </defs>

  <!-- Soft background shapes -->
  <circle cx="430" cy="190" r="170" fill="#d6e6fb" opacity="0.55"/>
  <circle cx="640" cy="64" r="58" fill="#cfe0fa" opacity="0.6"/>
  <circle cx="150" cy="300" r="34" fill="#d6e6fb" opacity="0.7"/>
  <g fill="#0071e3" opacity="0.18">
    <circle cx="606" cy="262" r="3"/><circle cx="626" cy="262" r="3"/><circle cx="646" cy="262" r="3"/><circle cx="666" cy="262" r="3"/>
    <circle cx="606" cy="282" r="3"/><circle cx="626" cy="282" r="3"/><circle cx="646" cy="282" r="3"/><circle cx="666" cy="282" r="3"/>
    <circle cx="606" cy="302" r="3"/><circle cx="626" cy="302" r="3"/><circle cx="646" cy="302" r="3"/><circle cx="666" cy="302" r="3"/>
  </g>

  <!-- Laptop with the request form -->
  <g filter="url(#shadow)">
    <rect x="214" y="62" width="336" height="214" rx="14" fill="#ffffff" stroke="#c9d9f2" stroke-width="2"/>
    <path d="M178 278 h408 a6 6 0 0 1 6 6 v4 a14 14 0 0 1 -14 14 h-392 a14 14 0 0 1 -14 -14 v-4 a6 6 0 0 1 6 -6 z" fill="#e3ecf9" stroke="#c9d9f2" stroke-width="2"/>
  </g>
  <rect x="352" y="278" width="60" height="7" rx="3.5" fill="#c9d9f2"/>
  <rect x="228" y="76" width="308" height="186" rx="6" fill="url(#screen)"/>
  <!-- form header -->
  <rect x="246" y="94" width="120" height="10" rx="5" fill="#1d1d1f" opacity="0.85"/>
  <rect x="246" y="112" width="190" height="6" rx="3" fill="#9fb3d1"/>
  <!-- fields: two columns, then a full one -->
  <rect x="246" y="134" width="60" height="6" rx="3" fill="#9fb3d1"/>
  <rect x="246" y="146" width="128" height="22" rx="6" fill="#ffffff" stroke="#c9d9f2" stroke-width="1.5"/>
  <rect x="390" y="134" width="60" height="6" rx="3" fill="#9fb3d1"/>
  <rect x="390" y="146" width="128" height="22" rx="6" fill="#ffffff" stroke="#c9d9f2" stroke-width="1.5"/>
  <rect x="246" y="180" width="80" height="6" rx="3" fill="#9fb3d1"/>
  <rect x="246" y="192" width="272" height="34" rx="6" fill="#ffffff" stroke="#c9d9f2" stroke-width="1.5"/>
  <rect x="256" y="202" width="150" height="5" rx="2.5" fill="#dbe5f3"/>
  <rect x="256" y="212" width="110" height="5" rx="2.5" fill="#dbe5f3"/>
  <!-- submit button -->
  <rect x="246" y="236" width="76" height="18" rx="9" fill="#0071e3"/>
  <rect x="262" y="243" width="44" height="4" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Phone with the request list -->
  <g filter="url(#shadow)">
    <rect x="566" y="120" width="104" height="196" rx="18" fill="#ffffff" stroke="#c9d9f2" stroke-width="2"/>
  </g>
  <rect x="604" y="130" width="28" height="5" rx="2.5" fill="#dbe5f3"/>
  <rect x="580" y="148" width="58" height="7" rx="3.5" fill="#1d1d1f" opacity="0.8"/>
  <g>
    <rect x="578" y="166" width="80" height="34" rx="8" fill="#f4f8fe"/>
    <circle cx="590" cy="183" r="5" fill="#0071e3"/>
    <rect x="601" y="176" width="48" height="5" rx="2.5" fill="#9fb3d1"/>
    <rect x="601" y="186" width="32" height="5" rx="2.5" fill="#dbe5f3"/>
  </g>
  <g>
    <rect x="578" y="208" width="80" height="34" rx="8" fill="#f4f8fe"/>
    <circle cx="590" cy="225" r="5" fill="#ffb648"/>
    <rect x="601" y="218" width="44" height="5" rx="2.5" fill="#9fb3d1"/>
    <rect x="601" y="228" width="28" height="5" rx="2.5" fill="#dbe5f3"/>
  </g>
  <g>
    <rect x="578" y="250" width="80" height="34" rx="8" fill="#f4f8fe"/>
    <circle cx="590" cy="267" r="5" fill="#38a169"/>
    <rect x="601" y="260" width="50" height="5" rx="2.5" fill="#9fb3d1"/>
    <rect x="601" y="270" width="36" height="5" rx="2.5" fill="#dbe5f3"/>
  </g>

  <!-- "Request sent" card -->
  <g filter="url(#shadow-sm)">
    <rect x="96" y="132" width="168" height="72" rx="14" fill="#ffffff" stroke="#d6e6fb" stroke-width="1.5"/>
  </g>
  <circle cx="126" cy="168" r="16" fill="#0071e3"/>
  <path d="M119 168 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="152" y="156" width="92" height="7" rx="3.5" fill="#1d1d1f" opacity="0.8"/>
  <rect x="152" y="171" width="64" height="5" rx="2.5" fill="#9fb3d1"/>
  <rect x="152" y="182" width="78" height="5" rx="2.5" fill="#dbe5f3"/>
</svg>
